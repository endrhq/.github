<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1250" viewBox="0 0 800 1250" role="img" aria-labelledby="title desc">
<title id="title">endr — Intent to evidence, compact layout</title>
<desc id="desc">Human intent and synthetic context feed Mission Assurance Lab. Baseline, reference and candidate workflows are compared under matched conditions including a simulated lost link. Evidence supports human review. Lost links never expand authority.</desc>
