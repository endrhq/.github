<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc">
<title id="title">endr — Mission Assurance Lab research layer overview</title>
<desc id="desc">Conceptual synthetic research architecture. Scenario fixtures and a run manifest supply matched baseline, reference and candidate workflows. Nominal and lost-link conditions are applied consistently. Independent authority evaluation sits at the execution boundary; tested workflows cannot change policy or evidence. Decision ledger, comparison report and replay support human review. Review informs subsequent inputs. Lost links never expand authority.</desc>
